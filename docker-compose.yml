# 开发联调：起全部依赖与进程（生产为 K8s，见 docs/IMPLEMENTATION.md §部署）
name: async-gateway

# 全部可配置项都由 .env 注入（权威清单见 .env.example）；这里只列**本地联调必须指向
# compose 内服务**的那几项，并写成 ${KEY:-默认} 形式：不配 .env 时行为与以前完全一致，
# 配了 .env 则该值生效（environment 优先级高于 env_file）。
# 对象存储**不在**本编排里：转存只走外部 MinIO/S3（可选件，见 .env.example「对象存储」一节），
# create 请求体/响应存档走 Redis（infra/request_store）——本地联调不配 S3_* 也能跑全链路。
x-app-env: &app-env
  AG_APP_ENV: ${AG_APP_ENV:-dev}
  AG_DATABASE_URL: ${AG_DATABASE_URL:-postgresql+asyncpg://async_gateway:async_gateway@postgres:5432/async_gateway}
  AG_REDIS_URL: ${AG_REDIS_URL:-redis://redis:6379/0}
  AG_CALLBACK_BASE_URL: ${AG_CALLBACK_BASE_URL:-http://gateway-api:8000}
  AG_CALLBACK_HMAC_KEYS: '${AG_CALLBACK_HMAC_KEYS:-{"k1":"dev-only-secret"}}'
  AG_ADMIN_TOKEN: ${AG_ADMIN_TOKEN:-dev-admin-token}

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  # .env 里声明的**其余配置项**（轮询间隔、背压、SSRF 白名单、结果策略……）由此注入。
  # 少了这一段，照着 .env.example 配出来的项在容器里全部不生效，且不报错、不告警。
  # required: false ⇒ 没有 .env 时照旧用上面的默认值，不报错。
  env_file:
    - path: .env
      required: false
  volumes:
    - ./src:/app/src:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: async_gateway
      POSTGRES_PASSWORD: async_gateway
      POSTGRES_DB: async_gateway
    command: ["postgres", "-c", "max_connections=200", "-c", "synchronous_commit=on"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U async_gateway -d async_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF：RPO <= 1s（§19）
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-build
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  gateway-api:
    <<: *app-build
    command: ["uvicorn", "async_gateway.gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      # 探针角色：镜像里的 HEALTHCHECK 是**角色感知**的（见 Dockerfile）。
      # 不显式声明也能从 PID 1 的 cmdline 推断；这里写出来是给"换命令/换编排"的人一个把手。
      AG_PROBE_ROLE: gateway
    ports: ["8000:8000"]

  worker:
    <<: *app-build
    command: ["python", "-m", "async_gateway.workers.worker", "--pools", "heavy-poll,light-poll"]
    environment:
      <<: *app-env
      AG_PROBE_ROLE: worker
    deploy:
      replicas: 2

  transfer-worker:
    <<: *app-build
    command: ["python", "-m", "async_gateway.workers.worker", "--pools", "transfer"]
    environment:
      <<: *app-env
      AG_PROBE_ROLE: worker

  scheduler:
    <<: *app-build
    # 生产固定单副本 + 就绪探针；恢复后按 next_poll_at 分批放出
    command: ["python", "-m", "async_gateway.workers.scheduler"]
    environment:
      <<: *app-env
      AG_PROBE_ROLE: scheduler
    deploy:
      replicas: 1

  inspector:
    <<: *app-build
    # 巡检面独立进程，与 scheduler 故障域隔离
    command: ["python", "-m", "async_gateway.workers.inspector"]
    environment:
      <<: *app-env
      AG_PROBE_ROLE: inspector
    deploy:
      replicas: 1

  task-admin:
    <<: *app-build
    command: ["uvicorn", "async_gateway.admin.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *app-env
      AG_PROBE_ROLE: admin
    ports: ["8080:8080"]

volumes:
  pgdata:
  redisdata:
