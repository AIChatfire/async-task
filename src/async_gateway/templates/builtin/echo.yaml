# 通用 echo 上游：用于 M1 骨架闭环与本地端到端测试（不依赖任何外部服务）
alias: echo
base_url: http://upstream-echo:9000
create_path: /v1/tasks
result_location: $.output.url
id_location: $.task_id
status_field: $.status
terminal:
  success: [succeeded]
  failure: [failed]
  expired: [expired]
capabilities:
  upstream_idempotent: false
  confirm_strategy: query_by_client_key
  cancel: true
  callback: true
  list_tasks: true
  per_key_isolation: true
  rate_limit_side_effect_free: true
normalize:
  fields: [prompt, duration]
strategy:
  # 300s 而不是 120s：轮询上限（AG_POLL_MAX_INTERVAL=60s）在限流退避期会把轮询节奏推到 60s，
  # 任务预算若只有 2×60s，"重投 + 创建 + 首次轮询"链条必然超期 ⇒ 任务被 timeout 收尾
  # 而不是重试成功（livetest-ai 报告 F5；校验器对该组合有告警，见 IMPLEMENTATION §3.18）。
  deadline_seconds: 300
  max_attempts: 3
notes: 本地/CI 用假上游；status 取值 queued|running|succeeded|failed
